project: orthology
email: researcher@example.org
accessions_file: test.csv
method: 1
copy_from_package: false
save_data: true

# A full RefSeq RNA download is large. Use an existing site database when possible.
database:
  mode: download
  directory: resources/blast/refseq_rna
  files: []
  download_workers: 1

# Optional target, not a dependency of BLAST.
refseq:
  collection_subset: vertebrate_mammalian
  seqtype: rna
  seqformat: gbff

# Provisional limits for development, not estimates for a full NCBI database.
# Set site- and data-specific values before submission, then revise from accounting.
resources:
  download_blastdb:
    mem_mb: 1024
    runtime: 60
  download_refseqrelease:
    mem_mb: 1024
    runtime: 60
  blastn:
    mem_mb: 1024
    runtime: 15
