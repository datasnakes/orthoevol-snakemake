channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - pip=25.0
  - git=2.48
  - blast=2.16.0
  # Use Conda binaries instead of compiling PyPI sources on older HPC systems.
  # Bounds match the OrthoEvolution integration branch where it specifies them.
  - numpy
  - scipy
  - pandas>=0.25.3
  - matplotlib-base
  - biopython>=1.85,<1.86
  - psutil>=5.6.7
  - pyyaml>=3.12
  - pydantic>=2,<3
  - pydantic-core
  - greenlet
  - pip:
      - OrthoEvol @ git+https://github.com/datasnakes/OrthoEvolution.git@snakemake-fixes
