[project]
name = "orthoevol-snakemake"
version = "0.1.0"
description = "A Snakemake workflow using the OrthoEvolution Python package."
requires-python = ">=3.11,<3.15"
dependencies = [
    "OrthoEvol",
    "snakemake==9.27.0",
]

[project.optional-dependencies]
slurm = ["snakemake-executor-plugin-slurm"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv]
package = false

[tool.uv.sources]
# Follow the integration branch while testing; pin a validated commit afterwards.
OrthoEvol = { git = "https://github.com/datasnakes/OrthoEvolution.git", branch = "snakemake-fixes" }

[tool.pytest.ini_options]
testpaths = [".tests"]
